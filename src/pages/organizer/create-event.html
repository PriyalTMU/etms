<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create event · ETMS</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar"><div class="inner">
    <a class="brand" href="/organizer">ETMS <span>Organizer</span></a>
    <div class="who"><span class="role-badge">Organizer</span><span id="who-name"></span>
      <button class="btn link" id="logout-btn" type="button">Log out</button></div>
  </div></header>

  <main class="container" style="max-width: 720px">
    <p><a href="/organizer">&larr; Back to your events</a></p>
    <section class="card">
      <h1>Create a new event</h1>
      <p class="subtitle">Fields marked <span class="req">*</span> are required.</p>

      <div id="form-errors" class="alert error" role="alert" tabindex="-1" hidden></div>

      <form id="event-form" novalidate>
        <div class="field" data-field="title">
          <label for="title">Title <span class="req">*</span></label>
          <input id="title" name="title" type="text" maxlength="100" aria-describedby="title-error">
          <div class="field-error" id="title-error"></div>
        </div>

        <div class="field" data-field="description">
          <label for="description">Description <span class="req">*</span></label>
          <textarea id="description" name="description" maxlength="2000" aria-describedby="description-error"></textarea>
          <div class="hint">What will happen at the event? Up to 2000 characters.</div>
          <div class="field-error" id="description-error"></div>
        </div>

        <div class="row">
          <div class="field" data-field="date">
            <label for="date">Date <span class="req">*</span></label>
            <input id="date" name="date" type="date" aria-describedby="date-error">
            <div class="field-error" id="date-error"></div>
          </div>
          <div class="field" data-field="time">
            <label for="time">Start time <span class="req">*</span></label>
            <input id="time" name="time" type="time" aria-describedby="time-error">
            <div class="field-error" id="time-error"></div>
          </div>
        </div>

        <div class="row">
          <div class="field" data-field="location">
            <label for="location">Location <span class="req">*</span></label>
            <input id="location" name="location" type="text" maxlength="150" placeholder="e.g. ENG 103" aria-describedby="location-error">
            <div class="field-error" id="location-error"></div>
          </div>
          <div class="field" data-field="capacity">
            <label for="capacity">Maximum capacity <span class="req">*</span></label>
            <input id="capacity" name="capacity" type="number" min="1" max="5000" step="1" inputmode="numeric" aria-describedby="capacity-error">
            <div class="hint">Whole number from 1 to 5000.</div>
            <div class="field-error" id="capacity-error"></div>
          </div>
        </div>

        <div class="actions">
          <button class="btn" type="submit" id="submit-btn">Create event</button>
          <a class="btn secondary" href="/organizer">Cancel</a>
        </div>
      </form>
    </section>
  </main>

  <script src="/shared/eventValidation.js"></script>
  <script src="/js/organizer-common.js"></script>
  <script src="/js/create-event.js"></script>
</body>
</html>
