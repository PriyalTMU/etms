<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · ETMS</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar"><div class="inner">
    <a class="brand" href="/">ETMS <span>Campus Events</span></a>
    <div class="who" id="site-who"></div>
  </div></header>

  <main class="container narrow">
    <section class="card">
      <h1>Create your attendee account</h1>
      <p class="subtitle">Sign up to get tickets for campus events. We only ask for what we need.</p>

      <div id="form-errors" class="alert error" role="alert" tabindex="-1" hidden></div>

      <form id="signup-form" novalidate>
        <div class="field" data-field="name">
          <label for="name">Full name <span class="req">*</span></label>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="80" aria-describedby="name-error">
          <div class="field-error" id="name-error"></div>
        </div>
        <div class="field" data-field="email">
          <label for="email">Email <span class="req">*</span></label>
          <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error">
          <div class="field-error" id="email-error"></div>
        </div>
        <div class="field" data-field="password">
          <label for="password">Password <span class="req">*</span></label>
          <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-hint password-error">
          <div class="hint" id="password-hint">At least 8 characters, with at least one letter and one number.</div>
          <div class="field-error" id="password-error"></div>
        </div>
        <div class="field" data-field="confirmPassword">
          <label for="confirmPassword">Confirm password <span class="req">*</span></label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" aria-describedby="confirmPassword-error">
          <div class="field-error" id="confirmPassword-error"></div>
        </div>
        <div class="actions">
          <button class="btn" type="submit" id="signup-btn">Create account</button>
        </div>
      </form>
      <p class="demo-box">Already have an account? <a href="/login">Log in</a></p>
    </section>
  </main>

  <script src="/shared/accountValidation.js"></script>
  <script src="/js/site-common.js"></script>
  <script src="/js/student-signup.js"></script>
</body>
</html>
